<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <!-- Abstract enterprise business-intelligence scene used as the login image panel. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1e3d"/>
      <stop offset="0.55" stop-color="#12305e"/>
      <stop offset="1" stop-color="#0b1a33"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <g opacity="0.14" stroke="#7dd3fc" stroke-width="1.4">
    <path d="M0 1200 C 200 1100, 400 1300, 600 1180 S 1000 1050, 1200 1150"/>
    <path d="M0 1260 C 220 1180, 420 1360, 640 1240 S 1020 1120, 1200 1220"/>
    <path d="M0 1320 C 240 1260, 460 1420, 680 1300 S 1040 1200, 1200 1290"/>
  </g>
  <g transform="translate(120 420)">
    <rect x="0" y="0" width="960" height="640" rx="28" fill="#0b1730" opacity="0.72" stroke="#3b5b8c" stroke-opacity="0.5"/>
    <rect x="60" y="470" width="90" height="120" rx="10" fill="url(#bar)" opacity="0.9"/>
    <rect x="200" y="390" width="90" height="200" rx="10" fill="url(#bar)" opacity="0.9"/>
    <rect x="340" y="300" width="90" height="290" rx="10" fill="url(#bar)" opacity="0.9"/>
    <rect x="480" y="350" width="90" height="240" rx="10" fill="url(#bar)" opacity="0.9"/>
    <rect x="620" y="230" width="90" height="360" rx="10" fill="url(#bar)" opacity="0.9"/>
    <rect x="760" y="160" width="90" height="430" rx="10" fill="url(#bar)" opacity="0.9"/>
    <polyline points="105,440 245,360 385,270 525,320 665,200 805,130" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <circle cx="105" cy="440" r="10" fill="#fbbf24"/><circle cx="245" cy="360" r="10" fill="#fbbf24"/>
    <circle cx="385" cy="270" r="10" fill="#fbbf24"/><circle cx="525" cy="320" r="10" fill="#fbbf24"/>
    <circle cx="665" cy="200" r="10" fill="#fbbf24"/><circle cx="805" cy="130" r="10" fill="#fbbf24"/>
    <text x="60" y="90" font-family="Segoe UI, Arial" font-size="44" fill="#dbeafe" opacity="0.95">Revenue &amp; operations</text>
    <text x="60" y="140" font-family="Segoe UI, Arial" font-size="28" fill="#93c5fd" opacity="0.8">Integrated business intelligence</text>
  </g>
  <g opacity="0.5">
    <circle cx="1050" cy="220" r="6" fill="#7dd3fc"/>
    <circle cx="180" cy="240" r="4" fill="#a5b4fc"/>
    <circle cx="1100" cy="1420" r="5" fill="#7dd3fc"/>
  </g>
</svg>
